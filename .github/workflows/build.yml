name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble every source and verify it byte for byte
        run: python3 tools/build.py
      - name: Check that the TunerPro definitions are well-formed XML
        run: python3 -c "import glob, xml.etree.ElementTree as ET; [ET.parse(f) for f in glob.glob('xdf/*.xdf')]; print(len(glob.glob('xdf/*.xdf')), 'XDF files OK')"
      - name: Edit test (source edit, XDF addresses, checksum repair)
        run: python3 tools/edittest.py
      - name: Inventory tool runs on a 128 KB and a 256 KB image
        run: python3 tools/revision.py build/05007038.bin && python3 tools/revision.py build/05293190AC.bin
      - name: Simulator self-test (stock Lookup3D and CalcFuelPulse against models)
        run: python3 tools/simtest.py build/05293190AC.bin && python3 tools/simtest.py build/04887050.bin
      - name: Experimental DinoFuel 128 KB port — dense grid and edge tests
        run: python3 patches/dinofuel/dinofuel128.py build/04887050.bin --full && python3 patches/dinofuel/dinofuel128.py build/05293013AC.bin --full
  dinofuel-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both original ROMs
        run: python3 tools/build.py 04887050 05293013AC
      - name: DinoFuel XDF and simulated edits
        run: python3 patches/dinofuel/xdfcheck.py
      - name: DinoFuel CPU16 timing and stack profile
        run: python3 patches/dinofuel/timing.py 04887050 && python3 patches/dinofuel/timing.py 05293013AC
  dinofuel-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both original ROMs
        run: python3 tools/build.py 04887050 05293013AC
      - name: Profile stock and patched jumps at MAP transitions
        run: python3 patches/dinofuel/boundarycheck.py
  dinofuel-v2-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pn: ['04887050', '05293013AC']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build.py ${{ matrix.pn }}
      - run: python3 patches/dinofuel/v2/check_calibration.py ${{ matrix.pn }}
      - run: python3 patches/dinofuel/v2/simulate.py ${{ matrix.pn }}
  dinofuel-v2-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pn: ['04887050', '05293013AC']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build.py ${{ matrix.pn }}
      - run: python3 patches/dinofuel/v2/simulate.py ${{ matrix.pn }} --full
  modular-spark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pn: ['04887050', '05293013AC']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 patches/common/resource_check.py
      - run: python3 tools/build.py ${{ matrix.pn }}
      - run: python3 patches/spark/simulate.py ${{ matrix.pn }}
  modular-spark-full:
